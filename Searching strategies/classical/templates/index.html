</head>

<body>

```
<h1>Graph Search Visualization</h1>


<!--
========================================
ALGORITHM BUTTONS
========================================
-->

<div id="controls">

    <button onclick="runAlgorithm('bfs')">
        BFS
    </button>

    <button onclick="runAlgorithm('dfs')">
        DFS
    </button>

    <button onclick="runAlgorithm('dijkstra')">
        Dijkstra
    </button>

</div>


<!--
========================================
GRAPH
========================================
-->

<div id="mynetwork"></div>


<!--
========================================
PATH
========================================
-->

<div id="path">
    Select an algorithm.
</div>


<script>


    /*
     * ========================================
     * VIS.JS NETWORK
     * ========================================
     */

    let network = null;



    /*
     * ========================================
     * RUN ALGORITHM
     * ========================================
     */

    function runAlgorithm(algorithm) {


        fetch(`/api/${algorithm}`)


            .then(res => res.json())


            .then(data => {


                console.log(
                    `${algorithm.toUpperCase()} data:`,
                    data
                );



                /*
                 * ========================================
                 * GET PATH
                 * ========================================
                 */

                const path = data.path || [];


                console.log(
                    `${algorithm.toUpperCase()} path:`,
                    path
                );



                /*
                 * ========================================
                 * DISPLAY PATH
                 * ========================================
                 */

                document.getElementById("path").innerHTML =
                    `${algorithm.toUpperCase()} Path: ` +
                    (
                        path.length > 0
                            ? path.join(" → ")
                            : "No path found"
                    );



                /*
                 * ========================================
                 * COLOR NODES
                 * ========================================
                 */

                data.nodes.forEach(node => {


                    const isPathNode =
                        path.includes(node.id);



                    if (isPathNode) {


                        /*
                         * Path node
                         */

                        node.color = {

                            background: "#3498db",

                            border: "#2c3e50"

                        };


                    } else {


                        /*
                         * Normal node
                         */

                        node.color = {

                            background: "#2ecc71",

                            border: "#2c3e50"

                        };

                    }

                });



                /*
                 * ========================================
                 * COLOR EDGES
                 * ========================================
                 */

                data.edges.forEach(edge => {


                    const fromIndex =
                        path.indexOf(edge.from);


                    const toIndex =
                        path.indexOf(edge.to);



                    /*
                     * An edge belongs to the path
                     * if its two nodes are consecutive
                     * in the algorithm path.
                     */

                    const isPathEdge =
                        fromIndex !== -1 &&
                        toIndex !== -1 &&
                        Math.abs(fromIndex - toIndex) === 1;



                    if (isPathEdge) {


                        /*
                         * Path edge
                         */

                        edge.color = "#3498db";

                        edge.width = 6;


                    } else {


                        /*
                         * Normal edge
                         */

                        edge.color = "#95a5a6";

                        edge.width = 2;

                    }



                    /*
                     * ========================================
                     * DISPLAY EDGE WEIGHT
                     * ========================================
                     *
                     * Dijkstra uses edge weights.
                     *
                     * If the weight is 0, we don't need
                     * to display it.
                     */

                    if (
                        edge.weight !== undefined &&
                        edge.weight !== null &&
                        edge.weight !== 0
                    ) {

                        edge.label = String(edge.weight);

                    }

                });



                /*
                 * ========================================
                 * GRAPH DATA
                 * ========================================
                 */

                const graphData = {


                    nodes:
                        new vis.DataSet(data.nodes),


                    edges:
                        new vis.DataSet(data.edges)

                };



                /*
                 * ========================================
                 * VIS.JS OPTIONS
                 * ========================================
                 */

                const options = {


                    nodes: {

                        shape: "dot",

                        size: 25,

                        font: {

                            size: 18

                        }

                    },


                    edges: {

                        width: 2,

                        font: {

                            size: 16,

                            align: "middle"

                        },

                        smooth: {

                            type: "cubicBezier",

                            roundness: 0.2

                        }

                    },


                    physics: {

                        stabilization: true

                    }

                };



                /*
                 * ========================================
                 * CREATE / UPDATE NETWORK
                 * ========================================
                 */

                const container =
                    document.getElementById("mynetwork");



                /*
                 * If the network already exists,
                 * destroy it before creating the
                 * new visualization.
                 */

                if (network !== null) {

                    network.destroy();

                }



                /*
                 * Create new network
                 */

                network = new vis.Network(

                    container,

                    graphData,

                    options

                );

            })


            /*
             * ========================================
             * ERROR HANDLING
             * ========================================
             */

            .catch(error => {


                console.error(

                    "Error loading algorithm:",

                    error

                );


                document.getElementById("path").innerHTML =

                    "Error running algorithm.";

            });

    }



    /*
     * ========================================
     * LOAD BFS BY DEFAULT
     * ========================================
     */

    runAlgorithm("bfs");


</script>

</body>

</html>
